<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code PTIT Auto Solver - Control Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 500px;
      min-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: #1a1a2e;
      color: #eee;
    }

    .header {
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      padding: 20px;
      border-bottom: 2px solid #00d9ff;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #00d9ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 .emoji {
      font-size: 24px;
    }

    .container {
      padding: 20px;
    }

    .section {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #2a3f5f;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #00d9ff;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: #0f1923;
      border: 1px solid #2a3f5f;
      border-radius: 6px;
      font-size: 13px;
      color: #eee;
      font-family: 'Consolas', 'Monaco', monospace;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #00d9ff;
      box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
    }

    input[type="text"]::placeholder {
      color: #555;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-save {
      background: #4a5568;
      color: white;
    }

    .btn-save:hover:not(:disabled) {
      background: #5a6678;
      transform: translateY(-1px);
    }

    .btn-start {
      background: linear-gradient(135deg, #00d9ff 0%, #00a8cc 100%);
      color: #0a0e1a;
      font-weight: 700;
    }

    .btn-start:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 217, 255, 0.4);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ff4757 0%, #e84118 100%);
      color: white;
    }

    .btn-stop:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
    }

    .terminal {
      background: #0a0e1a;
      border: 1px solid #1a2332;
      border-radius: 8px;
      padding: 12px;
      height: 240px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
    }

    .terminal::-webkit-scrollbar {
      width: 8px;
    }

    .terminal::-webkit-scrollbar-track {
      background: #0f1923;
      border-radius: 4px;
    }

    .terminal::-webkit-scrollbar-thumb {
      background: #2a3f5f;
      border-radius: 4px;
    }

    .terminal::-webkit-scrollbar-thumb:hover {
      background: #3a5080;
    }

    .log-line {
      margin-bottom: 4px;
      color: #00ff9f;
      word-wrap: break-word;
    }

    .log-line::before {
      content: '> ';
      color: #00d9ff;
      font-weight: bold;
    }

    .log-line.error {
      color: #ff4757;
    }

    .log-line.warning {
      color: #ffa502;
    }

    .log-line.info {
      color: #00d9ff;
    }

    .log-line.success {
      color: #00ff9f;
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .terminal-title {
      font-size: 12px;
      color: #00d9ff;
      font-weight: 600;
    }

    .terminal-clear {
      background: transparent;
      border: 1px solid #2a3f5f;
      color: #a0a0a0;
      padding: 4px 8px;
      font-size: 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .terminal-clear:hover {
      background: #2a3f5f;
      color: #fff;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-idle {
      background: #2a3f5f;
      color: #a0a0a0;
    }

    .status-running {
      background: rgba(0, 217, 255, 0.2);
      color: #00d9ff;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-error {
      background: rgba(255, 71, 87, 0.2);
      color: #ff4757;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      border-left: 3px solid;
    }

    .message.success {
      background: rgba(0, 255, 159, 0.1);
      border-left-color: #00ff9f;
      color: #00ff9f;
    }

    .message.error {
      background: rgba(255, 71, 87, 0.1);
      border-left-color: #ff4757;
      color: #ff4757;
    }

    .footer {
      padding: 12px 20px;
      text-align: center;
      font-size: 10px;
      color: #555;
      border-top: 1px solid #2a3f5f;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="emoji">🚀</span> Code PTIT Auto Solver</h1>
  </div>

  <div class="container">
    <!-- Config Section -->
    <div class="section">
      <div class="section-title">⚙️ Cấu hình</div>
      
      <div class="input-group">
        <label for="baseUrl">Omniroute Base URL</label>
        <input type="text" id="baseUrl" placeholder="Để trống nếu dùng Gemini mặc định">
      </div>

      <div class="input-group">
        <label for="apiKey">API Key</label>
        <input type="text" id="apiKey" placeholder="Nhập API key của bạn...">
      </div>

      <div class="input-group">
        <label for="modelName">Model Name</label>
        <input type="text" id="modelName" placeholder="flash 3.8" value="flash 3.8">
      </div>

      <div class="btn-group">
        <button class="btn-save" id="saveBtn">💾 Lưu Cấu Hình</button>
      </div>

      <div id="message"></div>
    </div>

    <!-- Control Section -->
    <div class="section">
      <div class="section-title">🎮 Điều khiển</div>
      
      <div class="btn-group">
        <button class="btn-start" id="startBtn">▶ Bắt đầu Auto Solve</button>
        <button class="btn-stop" id="stopBtn">🛑 Dừng</button>
      </div>
    </div>

    <!-- Terminal Section -->
    <div class="section">
      <div class="terminal-header">
        <div class="section-title">📟 Terminal Log</div>
        <button class="terminal-clear" id="clearBtn">Clear</button>
      </div>
      
      <div class="terminal" id="terminal">
        <div class="log-line info">System ready. Waiting for commands...</div>
      </div>
    </div>
  </div>

  <div class="footer">
    DLab Auto Solver v1.0 | Built with ❤️
  </div>

  <script src="popup.js"></script>
</body>
</html>
